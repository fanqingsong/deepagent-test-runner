server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hash routing still benefits from SPA fallback for deep links
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }
}

