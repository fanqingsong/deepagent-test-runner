apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
data:
  sampling-strategies.json: |
    {
      "default_strategy": {
        "param": 1,
        "type": "probabilistic"
      },
      "service_strategies": [
        {
          "service": "backend-service",
          "type": "probabilistic",
          "param": 0.1
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.50
        env:
          - name: COLLECTOR_OTLP_ENABLED
            value: "true"
          - name: SPAN_STORAGE_TYPE
            value: memory
        ports:
          - containerPort: 5775
            protocol: UDP
            name: zipkin-compact
          - containerPort: 6831
            protocol: UDP
            name: jaeger-compact
          - containerPort: 6832
            protocol: UDP
            name: jaeger-binary
          - containerPort: 5778
            protocol: TCP
            name: serve-config
          - containerPort: 16686
            protocol: TCP
            name: jaeger-ui
          - containerPort: 14268
            protocol: TCP
            name: jaeger-collector
          - containerPort: 14250
            protocol: TCP
            name: grpc
          - containerPort: 9411
            protocol: TCP
            name: zipkin
          - containerPort: 4317
            protocol: TCP
            name: otlp-grpc
          - containerPort: 4318
            protocol: TCP
            name: otlp-http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: jaeger-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: jaeger-collector
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: jaeger-ui
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  selector:
    app: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: observability
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: jaeger-ui
      port: 16686
      targetPort: 16686
      protocol: TCP
  selector:
    app: jaeger
