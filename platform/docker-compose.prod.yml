services:
  backend:
    command: ["sh", "-c", "uvicorn entrypoints.fastapi.main:app --host 0.0.0.0 --port 8001 --workers 2"]
    volumes: []
    environment:
      DEBUG: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8081:80"
    command: []
    environment: {}
    volumes: []

  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
