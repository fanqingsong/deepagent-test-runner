# Nginx Reverse Proxy (production)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    upstream frontend_static {
        server cc-test-frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        set $backend_host "cc-test-backend";
        set $backend_port "8001";

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API docs / OpenAPI
        location /api/docs { proxy_pass http://$backend_host:$backend_port; }
        location /api/redoc { proxy_pass http://$backend_host:$backend_port; }
        location /api/openapi.json { proxy_pass http://$backend_host:$backend_port; }

        # Unified API
        location /api/v1/ {
            proxy_pass http://$backend_host:$backend_port;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Frontend static (built)
        location / {
            proxy_pass http://frontend_static;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

